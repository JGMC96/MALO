name: Publicar la web

on:
  push:
    # Rama por defecto del repo hoy, y main por si más adelante se renombra.
    branches: [claude/new-session-jquuf0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requiere activar Pages una vez en el repo:
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      # Solo lo que sirve la web: la portada, la marca y el vídeo de fondo.
      - name: Reunir el sitio
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r media _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
