<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MALO Architects — Estudio de arquitectura</title>
  <meta name="description" content="MALO Architects, estudio de arquitectura. Web en construcción.">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">

  <meta property="og:title" content="MALO Architects">
  <meta property="og:description" content="Estudio de arquitectura. Web en construcción.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jgmc96.github.io/MALO/">
  <!-- Con dominio propio, cambia estas dos URL absolutas por las del dominio. -->
  <meta property="og:image" content="https://jgmc96.github.io/MALO/assets/og-image-1200x630.png">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* Tipografía de marca del kit, autoalojada. */
    @font-face {
      font-family: "Bodoni Moda";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("assets/fonts/bodoni-moda-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Bodoni Moda";
      font-style: italic;
      font-weight: 400 900;
      font-display: swap;
      src: url("assets/fonts/bodoni-moda-latin-italic.woff2") format("woff2");
    }

    * { box-sizing: border-box; }

    /* Un solo mundo visual: tinta sobre papel blanco. La animación da por
       supuesto el papel blanco, así que la página no cambia con el tema. */
    :root {
      --papel: #ffffff;
      --tinta: #111111;
      --gris: #8a8a86;
      --filete: rgba(17, 17, 17, 0.14);
      --filete-fuerte: rgba(17, 17, 17, 0.28);
      --tinta-texto: #f2f2f0;
      --tinta-gris: #9a9a95;

      --serif: "Bodoni Moda", "Bodoni MT", Didot, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;

      --margen: clamp(24px, 4.5vw, 72px);

      /* Una sola curva para todo el movimiento de la página. */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--papel);
      color: var(--tinta);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .pagina {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* Cabecera: solo el logo, arriba a la izquierda y sobre papel limpio. */
    .cabecera {
      padding: clamp(18px, 2vw, 26px) var(--margen);
    }

    .logo {
      display: block;
      width: clamp(220px, 30vw, 460px);
      height: auto;
    }

    .lamina {
      position: relative;
      flex: 1 1 auto;
      min-height: 220px;
    }

    /* En absoluto para que el canvas no arrastre la altura de la página.
       El ancho máximo recorta el papel sobrante en pantallas muy anchas:
       el dibujo se escala con la altura de la banda, no con el ancho. */
    .dibujo {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--margen);
      right: var(--margen);
      max-width: 1040px;
      margin-inline: auto;
    }

    .mensaje {
      padding: clamp(22px, 2.8vw, 34px) var(--margen) clamp(28px, 3.6vw, 46px);
      border-top: 1px solid var(--filete);
      margin-top: clamp(14px, 1.8vw, 24px);
    }

    .mensaje h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4.6vw, 3.5rem);
      font-weight: 400;
      letter-spacing: -0.015em;
      line-height: 1.04;
      text-wrap: balance;
    }

    .mensaje .sigue {
      margin: 0.55em 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1rem, 1.7vw, 1.3rem);
      color: var(--gris);
    }

    /* ---- Contacto: botón fijo abajo a la derecha y su panel ---- */

    .contacto-boton {
      position: fixed;
      right: clamp(18px, 3vw, 40px);
      bottom: clamp(18px, 3vw, 40px);
      z-index: 20;
      border: 0;
      background: var(--tinta);
      color: var(--tinta-texto);
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding: 16px 26px;
      cursor: pointer;
      transition: opacity 180ms ease, transform 120ms var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .contacto-boton:hover { opacity: 0.82; }
    }

    .contacto-boton:active { transform: scale(0.97); }
    .contacto-boton:focus-visible { outline: 2px solid var(--tinta); outline-offset: 4px; }

    .panel {
      position: fixed;
      right: clamp(18px, 3vw, 40px);
      bottom: calc(clamp(18px, 3vw, 40px) + 62px);
      z-index: 21;
      width: min(380px, calc(100vw - 36px));
      max-height: calc(100svh - 140px);
      overflow-y: auto;
      background: var(--papel);
      border: 1px solid var(--filete-fuerte);
      padding: clamp(22px, 2.4vw, 30px);
      box-shadow: 0 18px 48px rgba(17, 17, 17, 0.1);

      /* Crece desde el botón que lo abre, no desde su propio centro.
         Con transiciones (no fotogramas) para que aguante clics seguidos. */
      transform-origin: 100% 100%;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.96);
      transition:
        opacity 180ms var(--ease-out),
        transform 180ms var(--ease-out),
        height 240ms var(--ease-out),
        visibility 0s linear 180ms;
    }

    .panel.abierto {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition:
        opacity 220ms var(--ease-out),
        transform 220ms var(--ease-out),
        height 240ms var(--ease-out),
        visibility 0s;
    }

    /* Relevo entre el formulario y la confirmación. */
    .formulario, .panel h2 { transition: opacity 140ms var(--ease-out); }
    .recibido { transition: opacity 180ms var(--ease-out) 60ms; }
    .se-va, .recibido.llega { opacity: 0; }

    .panel-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .panel h2[hidden] { display: none; }

    .cerrar {
      margin-left: auto;
      border: 0;
      background: none;
      color: var(--gris);
      font-family: var(--sans);
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
      transition: color 180ms ease, transform 120ms var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .cerrar:hover { color: var(--tinta); }
    }

    .cerrar:active { transform: scale(0.9); }
    .cerrar:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

    .formulario { display: flex; flex-direction: column; gap: 18px; }
    .formulario[hidden] { display: none; }

    .campo { display: flex; flex-direction: column; gap: 7px; }

    .campo span {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gris);
    }

    .campo input,
    .campo textarea {
      font-family: var(--sans);
      font-size: 15px;
      color: var(--tinta);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--filete-fuerte);
      padding: 6px 0;
      transition: border-color 160ms ease;
    }

    .campo textarea { resize: vertical; min-height: 76px; }

    .campo input:focus,
    .campo textarea:focus {
      outline: none;
      border-bottom-color: var(--tinta);
    }

    .enviar {
      align-self: flex-start;
      margin-top: 4px;
      border: 0;
      background: var(--tinta);
      color: var(--tinta-texto);
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding: 14px 26px;
      cursor: pointer;
      transition: opacity 180ms ease, transform 120ms var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .enviar:hover { opacity: 0.82; }
    }

    .enviar:active { transform: scale(0.97); }
    .enviar:focus-visible { outline: 2px solid var(--tinta); outline-offset: 4px; }

    .recibido[hidden] { display: none; }

    .recibido .titulo {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .recibido .texto {
      margin: 0.7em 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--gris);
    }

    /* Entrada serena; el dibujo ya se traza solo. */
    @media (prefers-reduced-motion: no-preference) {
      .pagina > * {
        opacity: 0;
        animation: aparecer 420ms var(--ease-out) forwards;
      }
      .pagina > .cabecera { animation-delay: 0ms; }
      .pagina > .lamina   { animation-delay: 80ms; }
      .pagina > .mensaje  { animation-delay: 160ms; }
      @keyframes aparecer { to { opacity: 1; } }
    }

    /* Menos movimiento: se queda el fundido, se va el desplazamiento. */
    @media (prefers-reduced-motion: reduce) {
      .panel {
        transform: none;
        transition: opacity 150ms ease, visibility 0s linear 150ms;
      }
      .panel.abierto {
        transition: opacity 150ms ease, visibility 0s;
      }
      .contacto-boton:active,
      .enviar:active,
      .cerrar:active { transform: none; opacity: 0.7; }
    }

    @media (max-width: 620px) {
      .logo { width: min(80vw, 330px); }
      /* Deja sitio para que el botón fijo no pise la frase. */
      .mensaje { padding-bottom: 104px; }
      .panel { left: 18px; right: 18px; width: auto; }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <img class="logo" src="assets/logo-malo-negro.png" alt="MALO Architects" width="910" height="439">
    </header>

    <section class="lamina">
      <div class="dibujo" id="fondo" aria-hidden="true"></div>
    </section>

    <section class="mensaje">
      <h1>Web en construcción</h1>
      <p class="sigue">Mientras tanto, la obra sigue.</p>
    </section>
  </div>

  <button class="contacto-boton" id="abrir" aria-expanded="false" aria-controls="panel">Contacto</button>

  <div class="panel" id="panel" role="dialog" aria-labelledby="panel-titulo">
    <div class="panel-cabecera">
      <h2 id="panel-titulo">Contacto</h2>
      <button class="cerrar" id="cerrar" aria-label="Cerrar">&times;</button>
    </div>

    <!-- OJO: el formulario todavía no entrega el mensaje a ningún sitio; solo
         muestra la confirmación. Para que llegue de verdad hay que apuntarlo
         a un servicio de formularios (Formspree, Basin…) o a un backend. -->
    <form class="formulario" id="formulario" novalidate>
      <label class="campo">
        <span>Nombre</span>
        <input type="text" name="nombre" autocomplete="name" required>
      </label>
      <label class="campo">
        <span>Correo</span>
        <input type="email" name="correo" autocomplete="email" required>
      </label>
      <label class="campo">
        <span>Mensaje</span>
        <textarea name="mensaje" rows="4" required></textarea>
      </label>
      <button class="enviar" type="submit">Enviar</button>
    </form>

    <div class="recibido" id="recibido" tabindex="-1" role="status" hidden>
      <p class="titulo">Contacto recibido</p>
      <p class="texto">Gracias. Te respondemos en breve.</p>
    </div>
  </div>

  <script src="dist/architectural-site.js"></script>
  <script>
    ArchitecturalSite.mount(document.getElementById("fondo"), { intensity: 0.85 });

    (function () {
      const boton = document.getElementById("abrir");
      const panel = document.getElementById("panel");
      const cerrar = document.getElementById("cerrar");
      const formulario = document.getElementById("formulario");
      const recibido = document.getElementById("recibido");
      const titulo = document.getElementById("panel-titulo");

      const menosMovimiento = matchMedia("(prefers-reduced-motion: reduce)");

      const estaAbierto = () => panel.classList.contains("abierto");

      // Temporizador del relevo, para poder cancelarlo si el panel se cierra.
      let relevo = 0;

      function reponer() {
        panel.style.height = "";
        formulario.hidden = false;
        formulario.classList.remove("se-va");
        titulo.hidden = false;
        titulo.classList.remove("se-va");
        recibido.hidden = true;
        recibido.classList.remove("llega");
        formulario.reset();
      }

      function abrir() {
        // Si se cerró y se reabrió antes de que terminara la salida, la
        // confirmación seguiría puesta: se repone aquí también.
        if (formulario.hidden) reponer();
        panel.classList.add("abierto");
        boton.setAttribute("aria-expanded", "true");
        const primero = formulario.querySelector("input");
        if (primero) primero.focus();
      }

      function ocultar() {
        clearTimeout(relevo);
        relevo = 0;
        panel.classList.remove("abierto");
        boton.setAttribute("aria-expanded", "false");
        // El siguiente que abra encuentra el formulario en blanco. Se repone
        // al terminar la salida para que no se vea el cambio.
        setTimeout(() => {
          if (!estaAbierto()) reponer();
        }, menosMovimiento.matches ? 150 : 180);
      }

      boton.addEventListener("click", () => (estaAbierto() ? ocultar() : abrir()));
      cerrar.addEventListener("click", () => { ocultar(); boton.focus(); });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && estaAbierto()) { ocultar(); boton.focus(); }
      });

      document.addEventListener("pointerdown", (e) => {
        if (!estaAbierto()) return;
        if (!panel.contains(e.target) && !boton.contains(e.target)) ocultar();
      });

      // El formulario deja paso a la confirmación: se va el formulario, la
      // caja se asienta en su nueva altura y el mensaje llega mientras tanto.
      function mostrarRecibido() {
        relevo = 0;
        // Si el panel se cerró a media secuencia no hay nada que mostrar: medir
        // y enfocar aquí dejaría una altura fija sobre algo invisible.
        if (!estaAbierto()) return;

        const altoAntes = panel.offsetHeight;

        formulario.hidden = true;
        titulo.hidden = true;
        recibido.hidden = false;
        recibido.classList.add("llega");

        if (!menosMovimiento.matches) {
          const altoDespues = panel.offsetHeight;
          panel.style.height = altoAntes + "px";
          panel.getBoundingClientRect();          // fuerza el reflujo
          panel.style.height = altoDespues + "px";
          panel.addEventListener("transitionend", function fin(ev) {
            if (ev.propertyName !== "height") return;
            panel.style.height = "";
            panel.removeEventListener("transitionend", fin);
          });
        }

        requestAnimationFrame(() => recibido.classList.remove("llega"));
        recibido.focus();
      }

      formulario.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!formulario.reportValidity()) return;
        if (menosMovimiento.matches) { mostrarRecibido(); return; }
        formulario.classList.add("se-va");
        titulo.classList.add("se-va");
        relevo = setTimeout(mostrarRecibido, 140);
      });
    })();
  </script>
</body>
</html>
