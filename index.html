<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MALO Architects — Estudio de arquitectura</title>
  <meta name="description" content="MALO Architects, estudio de arquitectura. Web en construcción. ¿Tomamos un café?">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">

  <meta property="og:title" content="MALO Architects">
  <meta property="og:description" content="Estudio de arquitectura. Web en construcción. ¿Tomamos un café?">
  <!-- Al publicar con dominio propio, cambia esta URL por la absoluta: https://tudominio.com/assets/og-image-1200x630.png -->
  <meta property="og:image" content="assets/og-image-1200x630.png">

  <style>
    /* Tipografía de marca (kit gráfico): Bodoni Moda para titulares, autoalojada. */
    @font-face {
      font-family: "Bodoni Moda";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("assets/fonts/bodoni-moda-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Bodoni Moda";
      font-style: italic;
      font-weight: 400 900;
      font-display: swap;
      src: url("assets/fonts/bodoni-moda-latin-italic.woff2") format("woff2");
    }

    * { box-sizing: border-box; }

    :root {
      /* Colores del kit gráfico */
      --tinta: #111111;
      --gris: #8a8a86;
      --serif: "Bodoni Moda", "Bodoni MT", Didot, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: #fff;
      color: var(--tinta);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
    }

    .fondo { position: absolute; inset: 0; }

    .contenido {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 5vw, 64px);
    }

    .eyebrow {
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gris);
    }

    .centro { max-width: 34em; }

    .logo {
      display: block;
      width: clamp(260px, 36vw, 540px);
      height: auto;
      margin: 0 0 clamp(20px, 3vw, 36px) 0;
    }

    .estado {
      margin: 0;
      text-shadow: 0 0 14px #fff, 0 0 4px #fff, 0 0 2px #fff;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 400;
      line-height: 1.45;
    }

    .estado em {
      font-style: italic;
      color: var(--gris);
    }

    .abajo {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .cafe { margin: 0; }

    .cafe a {
      font-family: var(--serif);
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      font-weight: 400;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.1em;
      transition: opacity 160ms ease;
    }

    .cafe a:hover { opacity: 0.55; }

    .cafe .correo {
      display: block;
      margin-top: 0.9em;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--gris);
    }

    .pie {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--gris);
      text-align: right;
      white-space: nowrap;
    }

    /* Entrada serena del contenido; el fondo ya se dibuja solo. */
    @media (prefers-reduced-motion: no-preference) {
      .contenido > * {
        opacity: 0;
        transform: translateY(8px);
        animation: aparecer 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .contenido > .arriba  { animation-delay: 150ms; }
      .contenido > .centro  { animation-delay: 350ms; }
      .contenido > .abajo   { animation-delay: 550ms; }
      @keyframes aparecer {
        to { opacity: 1; transform: none; }
      }
    }

    @media (max-width: 560px) {
      .logo { width: min(78vw, 360px); }
      .abajo { flex-direction: column; align-items: flex-start; }
      .pie { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="fondo" id="fondo" aria-hidden="true"></div>

    <div class="contenido">
      <header class="arriba">
        <p class="eyebrow">Estudio de arquitectura</p>
      </header>

      <section class="centro">
        <img class="logo" src="assets/logo-malo-negro.png" alt="MALO Architects" width="910" height="439">
        <p class="estado">Web en construcción. <em>Mientras tanto, la obra sigue.</em></p>
      </section>

      <footer class="abajo">
        <p class="cafe">
          <!-- Cambia hola@estudiomalo.com por el correo real del estudio -->
          <a href="mailto:hola@estudiomalo.com">¿Tomamos un café?</a>
          <span class="correo">hola@estudiomalo.com</span>
        </p>
        <p class="pie">© 2026 MALO Architects</p>
      </footer>
    </div>
  </main>

  <script src="dist/architectural-site.js"></script>
  <script>
    ArchitecturalSite.mount(document.getElementById("fondo"), { intensity: 0.85 });
  </script>
</body>
</html>
